[package]
name = "hardcase"
version = "0.1.0"
description = "A local application testing workbench"
edition = "2021"

[lib]
name = "hardcase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dunce = "1.0.5"
